[platformio]
; Preserve the historical/development firmware target as the default.
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; 串口监视器波特率 (调试用)
monitor_speed = 115200

; ESP8266 的上传速率
upload_speed = 921600

; Purchased ESP-01S class: 1 MiB, UART0 only, manually gated boot/reset.
; A build does not verify the installed flash chip or physical command path.
[env:esp01_1m]
extends = env:nodemcuv2
board = esp01_1m
upload_speed = 115200
; Single-bit flash I/O is deliberately conservative across module variants.
board_build.flash_mode = dout

[env:native]
platform = native
test_framework = unity
