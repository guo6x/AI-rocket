[platformio]
; Keep the historical firmware target as the default. APM32 is opt-in only.
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; 允许通过USB转串口或ST-Link下载
; upload_protocol = serial
upload_protocol = stlink ; (如果你手头有ST-Link V2下载器，请取消这行注释，并注释掉上面那行)

; 串口监视器波特率设置
monitor_speed = 115200
; 开启输入框，按回车发送
monitor_filters = send_on_enter

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8

; Bound the STM32 Wire HAL transaction wait (ticks are milliseconds here).
; Stream::setTimeout() does not configure this I2C backend.
build_flags = -DI2C_TIMEOUT_TICK=10

; 终极物理环境破壁方案：允许国产兼容版芯片烧录 (忽略非原版 ST 芯片的 IDCODE 检查)
upload_flags = -c set CPUTAPID 0x2ba01477

; Experimental compatibility build, NOT a native APM32 board/core port.
; Inherits the historical 72 MHz / 64 KiB flash / 20 KiB RAM STM32 assumptions
; and existing TAP-ID override. Runtime/clock/flash-driver proof is human-gated.
[env:apm32f103c8_compat]
extends = env:bluepill_f103c8
build_flags =
    ${env:bluepill_f103c8.build_flags}
    -DAI_ROCKET_APM32_COMPAT_EXPERIMENTAL=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Itest/fakes
