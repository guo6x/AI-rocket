schema_version: 1
contract_id: "AA-JSON-R3-TELEMETRY-001"
stage: "P1_OFFLINE_READ_ONLY"
base_r3_contract: "AA-RF-OFFLINE-001"
status: "IMPLEMENTED_OFFLINE_ONLY"
evidence_ceiling: "TESTED_SOFTWARE"
physical_operation_allowed: false
control_authority: false
authentication: "NONE; CRC and session labels are not identity"
production_paths_unchanged:
  flight_json: "flight_computer/src/main.cpp"
  esp_relay: "esp8266_firmware/src/main.cpp"
  r3_codec: "rf_lab/telemetry_frame.py"
production_paths_modified:
  ground_station_parser: "ground_station/core/telemetry_parser.py (top-level JSON framing guard only; no control/authentication change)"
offline_converter: "rf_lab/json_r3_contract.py"
offline_tests: "rf_lab/tests/test_json_r3_contract.py"
wire_boundary:
  r3_header: "AR, version=1, kind=telemetry, session_id:uint32, sequence:uint16, payload_length:uint16"
  payload: "canonical UTF-8/ASCII JSON application object, schema AA-JSON-R3-TELEMETRY v1"
  crc: "CRC32-IEEE over header plus payload; corruption detection only"
  max_payload_bytes: 160
  session_policy: "first session binds locally; any later session change is rejected as untrusted"
  sequence_policy: "reuse R3 window for same session; duplicate/stale frames do not refresh"
timing_policy:
  sample_time_ms: "sensor acquisition timestamp supplied by flight JSON; not receiver time"
  send_time_ms: "flight JSON time/millis emission timestamp; not guaranteed radio egress instant"
  receive_time_ms: "optional local observer timestamp supplied only by offline caller"
  replay_time_ms: "optional offline playback timestamp; never a sensor measurement"
  wall_clock: "never substituted for a source timestamp"
  sample_time_ordering: "not enforced against sequence or receive time; an older source sample timestamp is a known age limitation"
source_policy:
  declared_source_mode: ["PHYSICAL", "SIMULATION", "OFFLINE_REPLAY"]
  accepted_input_aliases:
    "SIMULATION / OFFLINE REPLAY": "OFFLINE_REPLAY"
  source_identity: "always UNAUTHENTICATED"
  physical_claim: "source_mode=PHYSICAL is a declaration, not proof of a device"
  command_fields: "forbidden; converter has no command or actuator API"
field_mapping:
  - json: "time"
    r3: "t"
    meaning: "flight sender/emission millis"
    unit: "ms"
    required: true
  - json: "sample_time_ms"
    r3: "s"
    meaning: "sensor read-start millis"
    unit: "ms"
    required: "sensor_valid=1"
  - json: "sensor_valid"
    r3: "ok"
    meaning: "checked sample validity flag"
    unit: "boolean"
    required: true
  - json: "source_mode"
    r3: "m"
    meaning: "declared producer mode"
    unit: "enum"
    required: true
  - json: "pitch_raw / pitch_flt"
    r3: "p / pf"
    meaning: "raw and Kalman-filtered pitch"
    unit: "deg"
    required: "sensor_valid=1"
  - json: "roll_raw / roll_flt"
    r3: "r / rf"
    meaning: "raw and Kalman-filtered roll"
    unit: "deg"
    required: "sensor_valid=1"
  - json: "yaw"
    r3: "y"
    meaning: "gz gyro rate; not a yaw heading"
    unit: "deg/s"
    required: "sensor_valid=1"
  - json: "alt"
    r3: "h"
    meaning: "barometric altitude"
    unit: "m"
    required: "sensor_valid=1"
  - json: "batt"
    r3: "b"
    meaning: "reported battery field; current firmware value is a placeholder"
    unit: "V"
    required: false
  - json: "auto / control_state / chute / fstate"
    r3: "u / cs / c / f"
    meaning: "read-only software state"
    unit: "flag/string"
    required: false
  - json: "sensor_fault / sensor_fault_latched / sensor_io_budget_expired"
    r3: "e / l / q"
    meaning: "invalid-sample diagnostic state"
    unit: "string/flag"
    required: "sensor_valid=0 requires e"
  - json: "imu_address / imu_id / bmp_address / bmp_id"
    r3: "ia / ii / ba / bi"
    meaning: "diagnostic identity bytes"
    unit: "uint8"
    required: false
coordinate_and_precision:
  pitch: "atan2(-ax, sqrt(ay^2 + az^2)) in degrees; body-frame math only"
  roll: "atan2(ay, az) in degrees; body-frame math only"
  yaw: "gz gyro rate in degrees/second; not a heading"
  installed_axis_transform: "UNKNOWN"
  actuator_sign: "UNKNOWN"
  flight_json_numeric_text: "String(..., 2) for displayed measurements"
  binary_payload_numeric_precision: "canonical JSON numbers; no added quantization or accuracy claim"
validation_rules:
  malformed_crc_or_length: "reject; do not change sequence state"
  invalid_application_json_or_schema: "reject; do not change sequence state"
  missing_required_field: "reject; no fabricated zero or timestamp"
  duplicate: "reject; no freshness refresh"
  stale_or_out_of_order: "reject; no freshness refresh"
  increasing_sequence_with_old_sample_time: "accept as UNAUTHENTICATED while preserving source age; not anti-replay or trust"
  old_or_new_session: "reject_session_changed_untrusted; retain bound session"
  syntactically_valid_source: "degrade to UNAUTHENTICATED; never grant control"
  oversized_payload: "reject explicitly; never truncate silently"
reproduction:
  focused_test: "py -3 -m unittest rf_lab.tests.test_json_r3_contract -v"
  rf_suite: "py -3 -m unittest discover -s rf_lab/tests"
  evidence_generator: "py -3 -m rf_lab.contract_evidence --write-evidence engineering/offline-evidence/r3/json_r3_contract_evidence.json"
