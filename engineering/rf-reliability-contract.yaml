schema_version: 1
contract_id: "AA-RF-OFFLINE-RELIABILITY-001"
phase: "R3.1"
base_main_sha: "87392a5af6d7202ac926bed1cda6419403dde7a7"
technical_line: "AA-RF-BENCH-001"
scope: "Read-only, deterministic offline telemetry reliability and observability"
status: "DESIGN_AND_TEST_TASK_OPEN"
evidence_ceiling: "TESTED_SOFTWARE"
current_entrypoints:
  - "rf_lab/telemetry_frame.py"
  - "rf_lab/offline_link_replay.py"
  - "engineering/rf-offline-contract.yaml"
principles:
  - "Sender session_id is unauthenticated; changing session never establishes a trusted sender or hardware reboot."
  - "A gap in sequence numbers is unobserved data, not an independently measured RF packet loss."
  - "Synthetic fault rates and simulated elapsed time must never be labeled measured link metrics."
  - "CRC-32 detects accidental corruption but neither authenticates packets nor protects against deliberate modification."
  - "No flight-command, ACK/NACK actuation, guidance, recovery or control authority is connected."
  - "Existing R3.0 frame format remains stable unless compatibility analysis and versioning are explicit."
offline_scenarios:
  - "No faults, ordered sessions, explicit wraparound"
  - "Isolated drops and bursty contiguous drops"
  - "Duplicate and long-delayed packets"
  - "Corrupted CRC, truncated header, malformed length"
  - "Ambiguous half-range sequence delta and wraparound"
  - "Session churn and spoofable session label changes"
  - "Bounded random reproducible streams with fixed seeds and worst-case memory/performance checks"
receiver_indicators:
  - "Frames offered to synthetic receiver"
  - "Frames accepted, CRC-rejected, duplicate and stale"
  - "Session changes observed (untrusted)"
  - "Unobserved sequence-number gaps"
  - "Synthetic generation/delivery counts (separate from receiver estimations)"
  - "Maximum simulated consecutive unobserved span"
  - "Control-free read-only status and honest UNKNOWN / NOT_MEASURED labels"
verification:
  - "Deterministic seeded replay and invariant tests"
  - "No invented latency, throughput, range, drop probability or hardware timing"
  - "Immutable source/version/command/input-hash evidence"
  - "Run entire scripts/check.py without suppressing prior R0-R3 checks"
  - "No CI PASS claim when CI is not run"
non_goals:
  - "Actual LoRa/SX1278/RA-02 radio driver and pinout wiring"
  - "Choosing 433 MHz frequency, transmitter power, RF airtime settings or deployment legality"
  - "Automatic repeat requests / command retry / command frames"
  - "Authenticating an untrusted peer without a reviewed security protocol"
  - "Physical antenna, SPI, RF, sensor, actuator or propulsion operations"
open_risks:
  - "Unauthenticated session changes can reset current freshness window"
  - "16-bit sequence wrap imposes an ambiguous half-range"
  - "Corrupted/late datagrams bias raw reception-rate estimates"
  - "R3.0 176-byte frame/PHY packet compatibility not measured"
next_gate: "R3.1_OFFLINE_OBSERVABILITY_ACCEPTANCE"
