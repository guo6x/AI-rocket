schema_version: 1
audit_date: "2026-10-24"
software_baseline_command: "python scripts/check.py"
hardware_policy: "Hardware-gated checks are reported separately and do not fail the software-only check."
verification_items:
  - id: "python_syntax"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "python -m compileall -q aero_sim dynamics_sim ground_station flight_computer scripts"
    evidence: "Executed by the unified R1 gate with all R0 paths retained."
    limitations: "Syntax/import compilation is not behavioral validation."

  - id: "ground_station_tests"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "python -m pytest ground_station/tests -q"
    evidence: "49 passed, including the retained R0/R1 command/link regressions plus R2.1 explicit sensor-validity UI, raw/structured logging, invalid-frame freeze and recovery behavior."
    limitations: "No physical serial or ESP8266 hardware is involved."

  - id: "flight_core_native_tests"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio test -d flight_computer -e native"
    evidence: "47 tests passed for Kalman, production PID/Kalman source-equivalence vectors, production-main dt fallback at zero/>0.5 s, production FSM, canonical command processor, sensor identity/configuration/read validity, production-main fake-bus/control gating, recovery-deployed AUTO inhibition, E-STOP/reset, malformed/range/NUL handling, and isolated buffers."
    limitations: "No Arduino peripherals, sensors, or physical servos are exercised."

  - id: "gnc_only_bench_native_tests"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio test -d flight_computer -e native_gnc_only_bench"
    evidence: "4 tests passed with fake sensors, serial transports and Servo objects: valid manual/automatic TVC intent, recovery command rejection, invalid-sensor neutralization and command rejection, and ESTOP/RESET/re-arm while the recovery FSM/output remains idle."
    limitations: "Captures software write intent only; no physical sensor, servo, wiring, power, timing or recovery behavior is established."

  - id: "esp_relay_native_tests"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio test -d esp8266_firmware -e native"
    evidence: "3 tests passed for UDP command validation and UART ACK/NACK versus telemetry routing."
    limitations: "No ESP8266 radio, UART hardware, or packet-loss behavior is exercised."

  - id: "stm32_source_build"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio run -d flight_computer -e bluepill_f103c8"
    evidence: "Final frozen-source build passes: flash 55,160/65,536 bytes (84.2%); RAM 3,060/20,480 bytes (14.9%). Binary SHA-256: 33b76d83ec1a01e578bf73d5f80d821a997adfc4743e7463bbfea341d2c8a7a7."
    limitations: "Build success does not prove flashing, boot, timing, wiring, or sensor operation."

  - id: "esp8266_source_build"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio run -d esp8266_firmware -e nodemcuv2"
    evidence: "Final frozen-source NodeMCU build passes: flash 273,147/1,044,464 bytes; RAM 28,296/81,920 bytes. Binary SHA-256: 0b4e0a22405f2cfc4004ce8efd3a0d05845b0c4258a3f721060149003d8cae2a."
    limitations: "No WiFi association, packet delivery, range, or reconnect behavior is verified."

  - id: "apm32_compat_source_build"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio run -d flight_computer -e apm32f103c8_compat"
    evidence: "Final frozen-source compatibility build passes: flash 55,160/65,536 bytes (84.2%); RAM 3,060/20,480 bytes (14.9%). Binary SHA-256 matches bluepill build: 33b76d83ec1a01e578bf73d5f80d821a997adfc4743e7463bbfea341d2c8a7a7."
    limitations: "This is an opt-in STM32-core compatibility alias; no APM32 board was flashed, detected or run."

  - id: "gnc_only_bench_source_build"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio run -d flight_computer -e gnc_only_bench"
    evidence: "Opt-in recovery-isolated source build passes: flash 54,592/65,536 bytes (83.3%); RAM 3,060/20,480 bytes (14.9%). Binary SHA-256: 949729337011951a70d38b6d58b79ec4bad71cbbfb1b958d38ae6585fc1fa35b."
    limitations: "The compile-time profile is not flashed or powered; build success does not prove TVC motion, sensor accuracy, or physical recovery isolation."

  - id: "esp01s_source_build"
    verification_type: "software_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "platformio run -d esp8266_firmware -e esp01_1m"
    evidence: "Final build passes: flash 273,147/761,840 bytes (35.9% program region); RAM 28,296/81,920 bytes (34.5%). Binary SHA-256: e6a37fb554ef1420495cf9aa96a42c2bae0db307002237650f9a5a163ef9a209."
    limitations: "Build used a pre-existing ignored local wifi_config.h; no WiFi association, flash, boot, UART or physical relay path was exercised."

  - id: "simulation_smoke"
    verification_type: "simulation"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "python scripts/simulation_smoke.py"
    evidence: "Read-only deterministic kernel checks; tracked TUNED small-angle case converges and TESTBENCH non-ideal case diverges."
    limitations: "The plant assumptions are prototypes and are not correlated to measured hardware."

  - id: "r2_3_gnc_offline_source_parity"
    verification_type: "software_source_equivalence_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "python -m pytest scripts/tests/test_gnc_offline_oracle.py -q"
    evidence: "5 tests passed; an independent Python float32 oracle matched 34 production C++ PID/Kalman rows from 49 fixed trace records. Native production tests add signed/zero/step, static Kalman, output-limit and per-call rate-limit vectors."
    limitations: "This is source-equivalence evidence only. Firmware scheduler period, integer servo installation direction, sensor mounting, plant dynamics, and physical stability remain unmeasured/unknown."

  - id: "wifi_command_downlink"
    verification_type: "simulated_integration_test"
    classification: "TESTED_SOFTWARE"
    result: "PASS"
    command: "python -m pytest ground_station/tests/test_wifi_link_contract.py -q"
    evidence: "Behavioral socket tests cover Ground Station unicast send, simulated ESP/STM ACK and telemetry return, and wrong-source ACK/NACK rejection before configured-source resolution; native component tests and both target builds also pass."
    limitations: "No physical ESP8266/STM32/UART/WiFi integration; source correlation is not authentication, and UDP remains unauthenticated without request IDs or replay protection."

