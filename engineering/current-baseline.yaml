    - "engineering/tvc-mechanical-requirements.yaml"
    - "engineering/aeroforge-intake/**"
    - "docs/R2_1_REAL_ASSET_MULTI_BENCH_ARCHITECTURE.md"
    - "engineering/historical-hardware-capabilities.yaml"
    - "engineering/bringup/gnc-avionics-bringup.yaml"
    - "docs/R2_1_HISTORICAL_TO_CURRENT_DELTA_AUDIT.md"
    - "docs/R2_1_COMPATIBILITY_CLOSURE_REPORT.md"
  implementation:
    - "flight_computer/src/**"
    - "esp8266_firmware/src/**"
    - "ground_station/core/**"
    - "ground_station/ui/**"
  repeatable_software_verification:
    - "scripts/check.py"
    - "flight_computer/test/**"
    - "ground_station/tests/**"
    - "esp8266_firmware/test/**"
    - "scripts/simulation_smoke.py"
    - "scripts/r2_1_check.py"
    - "scripts/tests/**"

evidence_rules:
  ownership: "A completed purchase record is sufficient to mark a project asset as owned."
  article_assignment: "Assignment to a bench/article is configuration control and must be explicit."
  physical_configuration: "Wiring, pinout, geometry, orientation, calibration, and installed state require bench-specific evidence."
  hardware_verification: "Only a repeatable procedure/configuration/result/date evidence bundle may support VERIFIED_HARDWARE."

safety_scope:
  current_focus:
    - "low-energy GNC and avionics bring-up planning"
    - "software compatibility and interface audits"
    - "unpowered TVC measurement planning"
    - "RF bench architecture within applicable radio rules"
    - "foundational chemistry/materials/thermofluid learning and inert-fluid planning"
  excluded:
    - "free-flight readiness claims"
    - "unqualified hardware control claims"
    - "energetic propellant preparation or processing instructions"
    - "ignition development for energetic propulsion tests"
    - "unsupervised motor or combustion testing"
    - "automatic promotion of purchased assets to VERIFIED_HARDWARE"
