current_objective: >-
  Use the project's actually purchased hardware and tools to organize independent
  GNC, avionics, RF, TVC, recovery, propulsion-science, and later system-integration
  benches. Ownership, article assignment, physical configuration, and hardware
  verification remain distinct evidence levels.

project_development_model:
  principle: "Mature technical lines independently, then integrate only evidence-backed configurations."
  technical_lines:
    - {line_id: "GNC", article_id: "AA-GNC-BENCH-001"}
    - {line_id: "AVIONICS", article_id: "AA-AVIONICS-BENCH-001"}
    - {line_id: "RF", article_id: "AA-RF-BENCH-001"}
    - {line_id: "TVC", article_id: "AA-TVC-BENCH-001"}
