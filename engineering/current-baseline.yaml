    - {line_id: "MATERIALS_PROPULSION_SCIENCE", article_id: "AA-PROPULSION-SCIENCE-001"}
    - {line_id: "SYSTEM_INTEGRATION", article_id: "AA-SYSTEM-INTEGRATION-001"}

owned_asset_summary:
  authority: "engineering/assets/project-asset-registry.yaml"
  ownership_basis: "completed purchase records supplied by the project owner"
  near_term_core_assets:
    - "APM32F103C8T6 core board"
    - "GY-91 order variant: MPU9250 + BMP280"
    - "2x SG92R metal-gear 9 g servos"
    - "ESP8266 ESP-01S"
    - "ESP32-S3 DevKitC-1 N16R8"
    - "ST-LINK V2"
    - "CH340G USB-TTL"
    - "USB logic analyzer"
    - "digital multimeter"
    - "830-hole breadboard and jumper wires"
    - "LM2596S adjustable buck module"
    - "10 kg / 0.1 g electronic scale"
    - "2x SX1278 RA-02 plus 433 MHz RF accessories"
  excluded_transaction:
    - "LoRa 150 mm cable order shown as transaction closed"

current_near_term_priority:
  first: "GNC historical-hardware recovery and current re-baseline"
  second: "Avionics historical-configuration recovery and current target reconciliation"
  reason:
    - "The project already owns the necessary low-cost controller, sensor, servo, debug, and prototyping assets."
    - "Historical cloud records already report successful real-hardware stabilization, sensor reads, servo actuation, and ESP8266 command/telemetry behavior; the task is to recover and re-baseline that capability against current code."
    - "TVC CAD remains blocked by missing actual EDF/frame geometry."

current_blockers:
  - id: "R2_1-001"
    summary: "Historical domestic-compatible TAP-ID support recovered; subset compatibility audit and explicit experimental environment do not establish exact APM32 board, startup, clock or runtime proof."
  - id: "R2_1-002"
    summary: "Separate 1 MB ESP-01S target closes software form-factor/flash audit; physical boot, power and current R1 command/ACK/NACK return remain hardware-gated."
  - id: "R2_1-003"
    summary: "Historical flash/boot/sensor/servo/self-stabilization reports recovered, not erased. Only changed sensor-validity/R1-safety/current-transport behavior needs minimal regression; WiFi historical implementation/configuration gap remains."
  - id: "R2_1-004"
    summary: "Historical wiring records describe a working avionics bench, but the current accepted power/interface configuration has not yet been re-baselined against the purchased APM32/ESP-01S hardware and current firmware."
  - id: "R2_1-005"
    summary: "Pre-existing +/-2 g IMU range cannot reach recovery FSM's >2.5 g launch threshold; recovery qualification needs a separate configuration decision, not silent retuning in R2.1."
  - id: "R0-006"
    summary: "No PID profile is hardware-qualified; source values conflict."
  - id: "R0-007"
    summary: "Actual EDF bench geometry, mass, CG, thrust, and component envelopes are unknown."
  - id: "R0-011"
    summary: "CAD assets are mixed historical prototypes without configuration provenance or assembly validation."
  - id: "R0-014"
    summary: "Hardware claims lack repeatable repository evidence."

authoritative_sources:
  current_status:
    - "engineering/current-baseline.yaml"
    - "engineering/assets/project-asset-registry.yaml"
    - "engineering/experimental-lines.yaml"
    - "engineering/component-status.yaml"
    - "engineering/parameter-registry.yaml"
    - "engineering/verification-status.yaml"
    - "engineering/known-issues.md"
    - "engineering/command-safety-contract.yaml"
