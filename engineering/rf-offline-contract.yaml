  software_frame_byte_count:
    maximum_frame_bytes: 176
    arithmetic_comparison: "176 < 256 only; does not establish RA-02 packet/FIFO compatibility."
    crc_inclusion_semantics: "UNKNOWN"
  unresolved_interface_assumptions:
    - "Exact SMD-16 pin mapping for the owned module revision/batch."
    - "SPI register/FIFO addressing, transaction sequence, mode, clock and chip-select timing."
    - "DIO and RESET signal mapping, electrical levels and interrupt/timing behavior."
