  sources:
    - publisher: "Ai-Thinker"
      document: "Ra-02 LoRa Product Specification V1.1"
      document_date: "2017-12-19"
      reviewed_pages: "1-2 of 2"
      url: "https://aithinker-static.oss-cn-shenzhen.aliyuncs.com/docs/Public%20Document%20Center/LoRa/lora/Specification/Ra-02_V1.1%20Specification-20171219.pdf"
      confirmed_claims:
