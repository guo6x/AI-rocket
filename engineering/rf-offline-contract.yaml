    - "Owned module revision/batch identity and antenna/connectors."
    - "Legal frequency and transmit-power authorization for the operating region."
  physical_verification: "NOT_PERFORMED"
goal: >-
  Define a small, deterministic, read-only telemetry frame and verify its software
  behavior under loss, duplication, corruption and reordering before any RF
  firmware or integration into the safety-critical flight command channel.
protocol:
  canonical_document: "docs/R3_RF_OFFLINE_PROTOCOL.md"
  framing: "datagram; one complete frame per simulated datagram"
  wire_endian: "big"
  header_fields:
    - "magic: 2 bytes ASCII AR"
    - "version: uint8 = 1"
    - "kind: uint8 = 1 telemetry only"
    - "session_id: uint32 (non-authenticated epoch label)"
    - "sequence: uint16"
    - "payload_length: uint16"
  trailer: "CRC32 IEEE of 12-byte header plus payload; uint32 big-endian"
  overhead_bytes: 16
  payload_max_bytes: 160
  payload_semantics: "opaque telemetry bytes, no command vocabulary"
  telemetry_only: true
  authentication: false
  confidentiality: false
  crc_security_claim: false
  rf_payload_limit_proven: false
sequence_policy:
  modulo: 65536
  first_frame: "ACCEPT"
  same_sequence: "DUPLICATE"
  forward_delta_1_to_32767: "ACCEPT, with missing_sequence_count=delta-1 (unobserved, not proven lost)"
  backward_or_ambiguous_half_window: "STALE_OR_OUT_OF_ORDER"
  new_session_id: "SESSION_CHANGED; reset the receive window, not proof of authenticity"
faults_to_test:
  - "short frame"
  - "unknown magic or version or kind"
  - "declared payload overflow"
  - "truncated/oversized frame"
  - "CRC32 mismatch"
  - "duplicate sequence"
  - "forward gap and wraparound"
  - "late/out-of-order data"
  - "session transition"
  - "deterministic lossy/corrupted simulator"
hard_boundaries:
  - "No control or actuation command frame of any kind."
  - "No binding to STM32 Serial2, command_processor or ground station action controls."
  - "No physical RF transmission or advice setting transmitter power/frequency."
  - "No claim that CRC authenticates data or prevents injected messages."
  - "No claim that packet reception proves remote firmware acceptance or device health."
  - "No hardware, flight, propulsion or recovery qualification."
  - "Do not overwrite any existing ESP/WiFi path or historical simulation artifacts."
next_gate: "R3.1_OFFLINE_LINK_RELIABILITY_AND_INTEGRATION_AUDIT"
