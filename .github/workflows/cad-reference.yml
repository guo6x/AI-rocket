name: Electronics reference CAD (no fit or release)
on:
  pull_request:
    paths:
      - 'cad_reference/**'
      - 'engineering/parameter-registry.yaml'
      - '.github/workflows/cad-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CAD kernel and reference-only dependencies
        run: python -m pip install -r cad_reference/requirements.txt
      - name: Negative tests and actual STEP round trips
        run: python -m unittest discover -s cad_reference/tests -v
      - name: Generate separate current-run references
        run: python cad_reference/generate_reference.py --output "${RUNNER_TEMP}/reference-cad"
      - name: Ensure TVC CAD status stays blocked
        run: python scripts/cad_baseline_gate.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: reference-only-cad-${{ github.sha }}
          path: ${{ runner.temp }}/reference-cad
          if-no-files-found: error
          retention-days: 14
