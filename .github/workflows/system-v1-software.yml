name: SYSTEM-V1 full software gate (no hardware)

on:
  pull_request:
    branches: [main, feat/system-v1-mainline-ci-20261025]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIO_HOME_DIR: ${{ github.workspace }}/.pio-home
      PIO_TELEMETRY_OFF: "1"
    steps:
      - name: Checkout exact PR/main source
        uses: actions/checkout@v4
      - name: Select Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ground_station/requirements.txt
            aero_sim/requirements.txt
      - name: Install Linux headless Qt/native-build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install existing application, simulation, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r ground_station/requirements.txt -r aero_sim/requirements.txt
      - name: Record exact source and software environment
        shell: bash
        run: |
          {
            git rev-parse HEAD
            git status --short
            echo "event=${{ github.event_name }} head=${{ github.event.pull_request.head.sha }} base=${{ github.event.pull_request.base.sha }}"
            python --version
            platformio --version
            python -m pip freeze
            platformio system info
          } | tee system-v1-environment.txt
      - name: Execute existing complete project software checks
        shell: bash
        run: |
          set +e
          python -u scripts/check.py 2>&1 | tee system-v1-software-check.log
          status=${PIPESTATUS[0]}
          echo "$status" > system-v1-exit-code.txt
          exit "$status"
      - name: Run actual Qt desktop fallback smoke (synthetic only)
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/system_v1_runtime.py --output "${RUNNER_TEMP}/system-v1-ui-${GITHUB_SHA}" --soak-minutes 0.15 2>&1 | tee system-v1-ui-smoke.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / ("system-v1-ui-" + os.environ["GITHUB_SHA"]) / "runtime_result.json").read_text())
          fallback = report.get("fallback_2d", {}).get("status")
          gl = report.get("opengl", {}).get("status")
          assert report.get("qt_exit_code") == 0, report
          assert fallback == "PASS" or gl == "PASS", (fallback, gl)
          assert report["boundary"]["control_sends"] == 0
          assert report["boundary"]["hardware_connections"] == 0
          print("REAL_QT_SMOKE_PASS: visible 2D fallback or validated GL framebuffer, synthetic-only")
          PY
      - name: Save attributable log including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-v1-software-${{ github.sha }}-${{ github.run_id }}
          path: |
            system-v1-software-check.log
            system-v1-environment.txt
            system-v1-exit-code.txt
            system-v1-ui-smoke.log
            ${{ runner.temp }}/system-v1-ui-${{ github.sha }}/
          retention-days: 14
          if-no-files-found: ignore
